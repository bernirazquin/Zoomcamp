id: 08_taxi_backfill_challenge
namespace: zoomcamp

tasks:
  - id: iterate_taxi_types
    type: io.kestra.plugin.core.flow.ForEach
    values: ["green", "yellow"]
    tasks:
      - id: iterate_months
        type: io.kestra.plugin.core.flow.ForEach
        values: ["01", "02", "03", "04", "05", "06", "07"]
        tasks:
          - id: run_subflow
            type: io.kestra.plugin.core.flow.Subflow
            flowId: 08_gcp_taxi_hw # ID del flujo original
            namespace: zoomcamp
            inputs:
              year: "2021"
              month: "{{ taskrun.value }}" # El mes del bucle actual
              taxi: "{{ parent.taskrun.value }}" # El tipo de taxi del bucle padre
            wait: true # Espera a que termine uno antes de empezar el otro