# 1. PROJECT IDENTIFICATION
# Unique project name. All model configurations below must match this name.
name: 'taxi_rides_ny'
version: '1.0.0'
config-version: 2

# 2. DBT CLOUD CLI CONNECTION
# Links your local CLI to the specific dbt Cloud project ID.
# dbt-cloud:
#   project-id: 70471823554289

# Connection profile. In dbt Cloud environments, this is typically set to 'default'.
profile: 'default'

# 3. DIRECTORY PATHS
# Defines where dbt looks for specific resource types in your workspace.
model-paths: ["models"]      # SQL transformation models
analysis-paths: ["analyses"] # Ad-hoc analytical queries
test-paths: ["tests"]        # Data quality and validation tests
seed-paths: ["seeds"]        # Static CSV files to be loaded as tables
macro-paths: ["macros"]      # Reusable Jinja functions
snapshot-paths: ["snapshots"] # SCD (Slowly Changing Dimension) logic

# 4. TEMPORARY ARTIFACTS
# Location for compiled SQL and directories to be removed during 'dbt clean'.
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# 5. MODEL CONFIGURATIONS
# Defines materialization strategies (tables vs. views) by folder.
models:
  taxi_rides_ny: # Must match the 'name' defined in line 4
    
    # Staging: Usually materialized as views for cost-efficiency and speed.
    staging:
      +materialized: view 
    
    # Core: Materialized as tables for optimized downstream performance.
    core:
      +materialized: table 